services:
  invoicelite:
    image: ghcr.io/freecat7/invoicelite:${INVOICELITE_VERSION:-latest}
    container_name: invoicelite
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - invoicelite-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  invoicelite-data:
