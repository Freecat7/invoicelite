<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>invoicelite</title>
    <script>
      // Vor dem ersten Zeichnen setzen, sonst blitzt kurz das helle Schema auf.
      // Ohne gespeicherte Wahl bleibt es beim dunklen Standard.
      try {
        var t = localStorage.getItem('invoicelite-theme');
        if (t === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
