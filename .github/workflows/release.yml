name: Release

# Laeuft, wenn ein Tag wie v1.0.0 geschoben wird. Das Abbild wird erst
# veroeffentlicht, nachdem die Testreihe dagegen durchgelaufen ist.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # fuer "gh release create"
  packages: write   # fuer den Push nach ghcr.io

jobs:
  veroeffentlichen:
    name: Abbild bauen, prüfen und veröffentlichen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version und Abbildname bestimmen
        id: namen
        run: |
          version="${GITHUB_REF_NAME#v}"
          # ghcr.io verlangt Kleinschreibung, der Kontoname ist gemischt.
          pfad=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "abbild=ghcr.io/$pfad" >> "$GITHUB_OUTPUT"

      - name: Abbild bauen
        run: docker build -t "${{ steps.namen.outputs.abbild }}:${{ steps.namen.outputs.version }}" .

      - name: Instanz starten
        run: |
          docker run -d --name invoicelite-release -p 8099:3000 \
            -e ADMIN_EMAIL=test@example.com \
            -e ADMIN_PASSWORD=test-passwort-123 \
            -e TZ=Europe/Berlin \
            "${{ steps.namen.outputs.abbild }}:${{ steps.namen.outputs.version }}"
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8099/api/health && exit 0
            sleep 2
          done
          echo "Anwendung ist nicht hochgekommen:"
          docker logs invoicelite-release
          exit 1

      - name: API-Testlauf gegen das fertige Abbild
        run: python3 scripts/api-test.py http://localhost:8099

      - name: Protokoll bei Fehlschlag
        if: failure()
        run: docker logs invoicelite-release

      - name: An ghcr.io anmelden
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Abbild veröffentlichen
        run: |
          abbild="${{ steps.namen.outputs.abbild }}"
          version="${{ steps.namen.outputs.version }}"
          docker push "$abbild:$version"
          # "latest" nur fuer fertige Versionen, nicht fuer 1.0.0-rc1 und aehnliches.
          case "$version" in
            *-*) echo "Vorabversion, latest bleibt unberührt" ;;
            *)   docker tag "$abbild:$version" "$abbild:latest"
                 docker push "$abbild:latest" ;;
          esac

      - name: Release mit den Changelog-Notizen anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.namen.outputs.version }}"
          # Den Abschnitt dieser Version aus dem Changelog herausziehen.
          awk -v pat="^## ${version} " '
            $0 ~ pat { gefunden = 1; next }
            gefunden && /^## /  { exit }
            gefunden            { print }
          ' CHANGELOG.md > notizen.md
          if [ ! -s notizen.md ]; then
            echo "Kein Changelog-Abschnitt für $version gefunden." >&2
            exit 1
          fi
          printf '\n## Abbild\n\n```\n%s:%s\n```\n' \
            "${{ steps.namen.outputs.abbild }}" "$version" >> notizen.md
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notizen.md
